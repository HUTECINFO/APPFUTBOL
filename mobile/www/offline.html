<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Club One · Sin conexión</title>
  <style>
    :root { --bg: #0A0E14; --fg: #F2F5F8; --muted: rgba(242,245,248,.6); --pitch: #21C25E; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; text-align: center;
      padding: calc(env(safe-area-inset-top, 0px) + 24px) 28px calc(env(safe-area-inset-bottom, 0px) + 24px); }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { margin: 8px 0 0; font-size: 22px; font-weight: 700; letter-spacing: .02em; }
    p { margin: 0; max-width: 300px; color: var(--muted); font-size: 15px; line-height: 1.5; }
    button { margin-top: 10px; min-width: 200px; height: 50px; border: 0; border-radius: 16px;
      background: var(--pitch); color: #06110A; font-size: 15px; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; }
    button:active { opacity: .85; }
    button[disabled] { opacity: .6; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Club One">
    <h1>Sin conexión</h1>
    <p>No pudimos conectar con Club One. Revisa tu conexión a internet e inténtalo de nuevo.</p>
    <button id="retry" type="button">Reintentar</button>
  </main>
  <script src="config.js"></script>
  <script>
    (function () {
      var startUrl = (window.CLUB_ONE_CONFIG && window.CLUB_ONE_CONFIG.startUrl) || "/";
      var button = document.getElementById("retry");
      function retry() {
        button.disabled = true;
        button.textContent = "Conectando…";
        window.location.replace(startUrl);
      }
      button.addEventListener("click", retry);
      window.addEventListener("online", retry);
    })();
  </script>
</body>
</html>
